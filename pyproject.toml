[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gamestack"
version = "0.1.0rc1"
description = "A small CLI runtime for declarative game server packs"
readme = "README.md"
license-files = ["LICENSE", "THIRD_PARTY.md"]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.scripts]
gamestack = "gamestack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
